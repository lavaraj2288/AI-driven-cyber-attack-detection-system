{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | AI E-Gov Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
    }
    .navbar { background-color: #28a745; padding: 10px 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .navbar-brand { color: white !important; font-weight: bold; font-size: 1.3rem; }
    .navbar-nav .nav-link { color: white !important; margin-right: 20px; transition: color 0.3s ease; }
    .main-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .reset-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); padding: 40px 30px; max-width: 450px; width: 100%; text-align: center; }
    .reset-card h3 { color: #28a745; font-weight: bold; margin-bottom: 25px; }
    .btn-primary { background-color: #28a745; border: none; transition: background 0.3s ease; }
    .btn-primary:hover { background-color: #218838; }
    .back-link { display: inline-block; margin-top: 20px; color: #6c757d; font-weight: 600; text-decoration: none; transition: color 0.3s ease; }
    .back-link:hover { color: #495057; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'index' %}">AI E-Gov Portal</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Reset Section -->
  <div class="main-container">
    <div class="reset-card">

      {% if messages %}
      {% for message in messages %}
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script>
        Swal.fire({
          icon: '{{ message.tags }}' === 'error' ? 'error' : 'success',
          title: '{{ message }}',
          showConfirmButton: {% if reset_success %}false{% else %}true{% endif %},
          {% if reset_success %}timer: 2000{% endif %}
        });
        {% if reset_success %}
        setTimeout(() => {
          window.location.href = "{% url 'login' %}";
        }, 2000);
        {% endif %}
      </script>
      {% endfor %}
      {% endif %}

      <form method="POST" autocomplete="off">
        {% csrf_token %}

        <h3>Reset Password</h3>

        <div class="mb-3 text-start">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" placeholder="Enter username" required>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label">New Password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="new_password" placeholder="Enter new password" minlength="8" title="Password must contain at least 8 characters" required>
            <button class="btn btn-outline-secondary toggle-password-btn" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="confirm_password" placeholder="Confirm new password" minlength="8" required>
            <button class="btn btn-outline-secondary toggle-password-btn" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Update Password</button>

        <a href="{% url 'login' %}" class="back-link">Back to Login</a>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.toggle-password-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      });
    });
  </script>
</body>
</html>
