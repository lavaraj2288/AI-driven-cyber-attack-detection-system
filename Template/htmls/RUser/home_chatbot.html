{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Support AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb, #ebedee);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-header {
            background: #28a745;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-body {
            height: 400px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 85%;
        }
        .user-msg {
            background: #28a745;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background: #f1f3f5;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #dee2e6;
        }
        .chat-footer {
            padding: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-robot"></i> Home Support AI</h5>
            <a href="/" class="btn btn-sm btn-light" style="border-radius: 20px;">Exit</a>
        </div>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="message ai-msg">
            Hello! I'm here to help you navigate our Smart City AI Portal. How can I assist you today?
        </div>
        
        {% if message %}
        <div class="message user-msg">
            {{ message }}
        </div>
        {% endif %}

        {% if response %}
        <div class="message ai-msg">
            {{ response }}
        </div>
        {% endif %}
    </div>
    <div class="chat-footer">
        <form method="POST" action="{% url 'home_chatbot' %}">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="message" class="form-control" placeholder="Ask about login, register..." required style="border-radius: 25px 0 0 25px;">
                <button class="btn btn-success" type="submit" style="border-radius: 0 25px 25px 0;">
                    <i class="bi bi-send"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const chatBody = document.getElementById('chatBody');
    chatBody.scrollTop = chatBody.scrollHeight;
</script>

</body>
</html>
