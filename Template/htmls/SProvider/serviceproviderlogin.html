{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      color: #333;
      /* overflow removed for Render compatibility */
    }

    .navbar {
      background-color: #28a745;
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .navbar-brand {
      color: white !important;
      font-weight: bold;
      font-size: 1.3rem;
    }

    .navbar-nav .nav-link {
      color: white !important;
      margin-right: 20px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: #d4edda !important;
    }

    .mainholder {
      height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .login-card {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 400px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .login-card h4 {
      color: #28a745;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .btn-custom {
      background: linear-gradient(45deg, #ff416c, #28a745);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 20px;
      font-weight: bold;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-custom:hover {
      transform: scale(1.02);
      color: white;
    }

    .alt-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    .alt-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">AI Cyber Portal</a>
      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">User Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="mainholder">
    <div class="login-card">
      {% if messages %}
      {% for message in messages %}
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script>
        Swal.fire({
          icon: '{{ message.tags }}' === 'error' ? 'error' : 'success',
          title: '{{ message }}',
        });
      </script>
      {% endfor %}
      {% endif %}

      {% if login_success %}
      <script>
        setTimeout(() => {
          window.location.href = "{% url 'View_Remote_Users' %}";
        }, 2000);
      </script>
      {% endif %}

      <h4>Admin Login</h4>

      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <div class="form-group mb-3 text-start">
          <input type="text" name="username" autocomplete="username" class="form-control" placeholder="Enter admin username"
            required>
        </div>

        <div class="form-group mb-3 text-start">
          <div class="input-group">
            <input type="password" name="password" id="password" autocomplete="new-password" class="form-control"
              placeholder="Enter admin password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-3 text-end">
           <a href="{% url 'forgot_password_admin' %}" style="color: #28a745; text-decoration: none; font-size: 0.9rem; font-weight: 500;">Forgot Password?</a>
        </div>

        <button type="submit" name="submit1" class="btn btn-custom">Login</button>
      </form>

      <div class="text-center mt-3 alt-link">
        <p>👉 <a href="{% url 'login' %}">User Login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const toggleIcon = document.querySelector('#toggleIcon');

    if (togglePassword && password) {
      togglePassword.addEventListener('click', function (e) {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
      });
    }
  </script>
</body>

</html>
