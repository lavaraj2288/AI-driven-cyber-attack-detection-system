{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Registration | AI E-Gov Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; font-family: "Poppins", sans-serif; background: linear-gradient(135deg, #fdfbfb, #ebedee); color: #333; }
    .navbar { background-color: #28a745; padding: 10px 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .navbar-brand { color: white !important; font-weight: bold; font-size: 1.3rem; }
    .navbar-nav .nav-link { color: white !important; margin-right: 20px; font-weight: 500; transition: color 0.3s ease; }
    .mainholder { height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; overflow: auto; }
    .login-card { background-color: white; padding: 40px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); width: 100%; max-width: 400px; }
    .login-card h4 { color: #28a745; text-align: center; font-weight: bold; margin-bottom: 20px; }
    .btn-custom { background: linear-gradient(45deg, #ff416c, #28a745); color: white; border: none; border-radius: 30px; padding: 10px 20px; font-weight: bold; transition: all 0.3s ease; width: 100%; }
    .btn-custom:hover { transform: scale(1.02); color: white; }
    .alt-link a { color: #007bff; text-decoration: none; font-weight: bold; }
    .alt-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">AI Cyber Portal</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'serviceproviderlogin' %}">Admin Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="mainholder">
    <div class="login-card">

      {% if messages %}
      {% for message in messages %}
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script>
        Swal.fire({
          icon: '{{ message.tags }}' === 'error' ? 'error' : 'success',
          title: '{{ message }}',
          showConfirmButton: {% if register_success %}false{% else %}true{% endif %},
          {% if register_success %}timer: 2000{% endif %}
        });
        {% if register_success %}
        setTimeout(() => {
          window.location.href = "{% url 'serviceproviderlogin' %}";
        }, 2000);
        {% endif %}
      </script>
      {% endfor %}
      {% endif %}

      <h4>Register New Admin</h4>

      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <p style="color:#d9534f; font-size:14px; margin-bottom: 8px; font-weight: bold; text-align: left;">Authorization Required:</p>
        <div class="form-group mb-3 text-start">
          <input type="text" name="auth_username" autocomplete="new-password" class="form-control" placeholder="Enter Main Admin Username" required>
        </div>
        <div class="form-group mb-3 text-start">
          <div class="input-group">
            <input type="password" name="auth_password" autocomplete="new-password" class="form-control" placeholder="Enter Main Admin Password" required>
            <button class="btn btn-outline-secondary toggle-password-btn" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <hr style="margin: 20px 0; border-top: 1px solid #ddd;">
        <p style="color:#28a745; font-size:14px; margin-bottom: 8px; font-weight: bold; text-align: left;">New Admin Details:</p>
        
        <div class="form-group mb-3 text-start">
          <input type="text" name="username" autocomplete="new-password" class="form-control" placeholder="Choose New Admin Username" required>
        </div>
        <div class="form-group mb-3 text-start">
          <div class="input-group">
            <input type="password" name="password" autocomplete="new-password" class="form-control" placeholder="Choose New Admin Password" minlength="8" title="Password must contain at least 8 characters" required>
            <button class="btn btn-outline-secondary toggle-password-btn" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-custom mt-3">Register</button>
      </form>

      <div class="text-center mt-3 alt-link">
        <p>👉 <a href="{% url 'serviceproviderlogin' %}">Back to Admin Login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.toggle-password-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      });
    });
  </script>
</body>
</html>
